<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Empresa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    /* Franja superior fija */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #d32f2f; /* rojo corporativo */
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    .top-bar img {
      height: 40px;
    }
    .top-bar .contact-info {
      font-size: 0.9rem;
    }

    /* Contenedor principal debajo de la franja */
    .main-container {
      display: flex;
      margin-top: 70px; /* espacio para la franja fija */
      height: calc(100vh - 70px);
    }

    .form-side {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #fff;
    }
    .form-side h2 {
      color: #d32f2f;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }
    .btn:hover {
      background: #b71c1c;
    }
    .message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #555;
    }

    .image-side {
      flex: 1;
      background: url("aviso-ggee.jpg") no-repeat center center;
      background-size: cover;
    }
  </style>
</head>
<body>
  <!-- Franja superior -->
  <div class="top-bar">
    <img src="main/ScotiaLogo.svg" alt="Logo Empresa">
    <div class="contact-info">
      📧 contacto@empresa.cl | ☎ +56 2 1234 5678
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="main-container">
    <!-- Formulario a la izquierda -->
    <div class="form-side">
      <h2>Portal Empresa</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="rutEmpresa">RUT Empresa</label>
          <input type="text" id="rutEmpresa" name="rutEmpresa" placeholder="12.345.678-9" required>
        </div>
        <div class="form-group">
          <label for="rutPersona">RUT Usuario</label>
          <input type="text" id="rutPersona" name="rutPersona" placeholder="98.765.432-1" required>
        </div>
        <div class="form-group">
          <label for="passwd">Clave</label>
          <input type="password" id="passwd" name="passwd" placeholder="********" required>
        </div>
        <button type="submit" class="btn">Ingresar</button>
      </form>
      <div class="message" id="message"></div>
    </div>

    <!-- Imagen fija a la derecha -->
    <div class="image-side"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rutEmpresa = document.getElementById('rutEmpresa').value;
      const rutPersona = document.getElementById('rutPersona').value;
      const passwd = document.getElementById('passwd').value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rutEmpresa, rutPersona, passwd })
      });

      const data = await res.text();
      document.getElementById('message').textContent = data;
    });
  </script>
</body>
</html>
